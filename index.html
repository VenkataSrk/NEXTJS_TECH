<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campaign Management</title>
  <style>
    /* Loader styling */
    #contact_center_mainloader {
      z-index: 999999999;
      position: fixed;
      left: 0;
      top: 0;
      margin: 0;
      text-align: center;
      display: flex;
      align-items: center;
      flex-direction: column;
      gap: 12px;
      color: #757576;
      width: 100%;
      height: 100vh;
      justify-content: center;
      background: #fff;
    }

    #contact_center_loader {
      border: 5px solid #f3f3f3;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border-top: 5px solid #000;
      animation: spin 1s linear infinite;
    }

    .loadder {
      width: 40px;
      height: 40px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <div id="contact_center_mainloader">
    <div id="contact_center_loader"></div>
    <!-- <img src="/loader.gif" class="loadder" /> -->

    <!-- <p>Please wait while loading...</p> -->
  </div>
</body>

</html>
