<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Relationship Management</title>
  </head>
  <body>
    <div id="root"></div>
    <div style="display: none">
    <canvas id='canvas123' style="display: none;"></canvas>
    <div className="video">
      <video id="remoteVideo" width="100%" src="" autoPlay="{true}" preload="none"></video>
    </div>
    <audio id="ringer" loop crossorigin="anonymous" controls>
    </audio>
  </div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- <script type="module" src="https://qacampaign.worktual.co.uk/webPushSdk.bundle.js"></script> -->
<script src="https://qacampaign.worktual.co.uk/webPushSdk.js"></script>

    <script>
      async function onUserLoginSuccess(user) {
        console.log("user:::>>>",user)
        // user.email comes from that website login response
        await window.WorktualWebPushSDK?.subscribeWithCampaignDefaults({
          baseUrl: "https://qacampaignapi.worktual.co.uk/campaignService/v1",   // static
          domainId: 7833,                                      // static per website
          customer: {
            email: user?.email || "",                               // dynamic
            source: "Website-A",                             // static
            customerType: "B2C"                              // static
          }
        });
      }
    </script>

  </body>
</html>
