<!DOCTYPE html>

    <title>Template</title>

    <style>
        .submitbtn {
            min-width: 60px;
            border-radius: 6px;
            border: 1px solid var(--border-line, #D2D3D4);
            background: var(--Full-White, #FFF);
            color: black;
            font-size: 14px;
            font-family: sans-serif;
        }

        .okbtn {
            min-width: 60px;
            border-radius: 6px;

            background: black;
            color: #fff;
            font-size: 14px;
            font-family: sans-serif;
        }

        .checkboxcontainercsass {
            display: block;
            position: relative;
            padding-left: 28px;
            cursor: pointer;
            font-size: 14px;
            user-select: none;
            color: #000000;
            margin: 0;
            font-family: sans-serif;
            line-height: normal;
            margin-bottom: 12px;

        }

        input[type="radio"] {
            accent-color: #009d72;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .checkboxcontainercsass input {

            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;

        }

        .checkmarkcsaas {
            position: absolute;
            top: -1px;
            top: 1px;
            left: 0;
            height: 12px;
            width: 12px;
            border: 1px solid #757676;
            border-radius: 4px;
            margin: 0;
        }

        .checkboxcontainercsass input:checked~.checkmarkcsaas {
            background-color: #00b885;
        }

        .checkboxcontainercsass .checkmarkcsaas:after {
            content: "";
            position: absolute;
            display: none;
        }

        .checkboxcontainercsass input:checked~.checkmarkcsaas:after {
            display: block;
        }

        .checkboxcontainercsass .checkmarkcsaas:after {
            left: 4px;
            top: 0px;
            width: 2.5px;
            height: 8px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 22px;
            min-width: 36px;
            margin: 0 !important;

        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            -webkit-transition: 0.4s;
            transition: 0.4s;
        }

        .switch .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: 0.4s;
        }

        .switch input:checked+.slider {
            background-color: #00b885;
        }

        .switch input:focus+.slider {
            box-shadow: 0 0 1px #00b885;
        }

        .switch input:checked+.slider:before {
            transform: translateX(14px);
        }

        .switch .slider.round {
            border-radius: 34px;
            margin: 0;
        }

        .switch .slider.round:before {
            border-radius: 50%;
        }
    </style>
    <style>
        .rating {
            display: flex !important;
            justify-content: center !important;
            gap: 10px !important;
            font-family: Arial, sans-serif !important;
        }

        .rating input {
            display: none;
        }

        .rating label {
            cursor: pointer;
            font-size: 2rem;
            color: #ccc;
            /* Color of the empty star */
            display: block;
        }

        .rating input:checked~label,
        .rating input:checked~label~label {
            color: #f5b301;
            /* Color of the filled stars */
        }

        .rating input:checked~label {
            color: #f5b301;
            /* Color of the filled stars */
        }

        .rating input:hover~label,
        .rating label:hover,
        .rating label:hover~label {
            color: #f5b301;
            /* Color when hovering over the star */
        }

        .rating-text {
            font-size: 14px;
            text-align: center;
            margin-bottom: 5px;
        }
    </style>
    <style>
        .rating a {
            text-decoration: none;
            /* Remove the blue underline */
        }

        .rating a label {
            color: black;
            /* Set the color for the star */
            font-size: 26px;
        }

        .rating a:hover label {
            color: gold;
        }

        .rating-text {
            text-align: center;
        }
    </style>
